[package]
name = "wt-app"
# The only crate that carries the release version: a version bump recompiles
# this shim alone, never the libraries it links (docs/ci.md).
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wt"
path = "src/main.rs"
# The library it links is also named `wt`; document only the library.
doc = false

[dependencies]
wt-cli.workspace = true

[lints]
workspace = true
