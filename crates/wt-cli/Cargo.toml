[package]
name = "wt-cli"
# Fixed: only the shipped binary carries the release version (docs/ci.md).
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

# Crate name `wt` keeps module paths, and with them tracing targets such as
# `wt::freshness`, identical to when this code was the `wt` binary. Logs,
# the activity feed and native checks match on those targets.
[lib]
name = "wt"

[dependencies]
futures-util.workspace = true
anyhow.workspace = true
clap.workspace = true
getrandom.workspace = true
libc.workspace = true
notify.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
globset.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
wt-config.workspace = true
wt-actions.workspace = true
wt-automations.workspace = true
wt-dev.workspace = true
wt-core.workspace = true
wt-github.workspace = true
wt-harness.workspace = true
wt-lifecycle.workspace = true
wt-naming.workspace = true
wt-launcher.workspace = true
wt-platform.workspace = true
wt-runtime.workspace = true
wt-remote.workspace = true
wt-stack.workspace = true
wt-sst.workspace = true
wt-events.workspace = true
wt-store.workspace = true
wt-skills.workspace = true
wt-tui.workspace = true
wt-tmux.workspace = true
wt-update.workspace = true
wt-vcs.workspace = true

[dev-dependencies]
rusqlite.workspace = true
wt-runtime = { workspace = true, features = ["testing"] }

[lints]
workspace = true
