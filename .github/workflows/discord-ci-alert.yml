# Post unsuccessful main-branch CI and release-cache completions, except cancellations, to Discord #github.
# A run that failed only because jobs were cancelled (a runner that never
# arrived) is rerun once without an alert; a second such attempt is posted.
# Secret: DISCORD_GITHUB_WEBHOOK (the channel webhook URL, without /github).
name: discord-ci-alert

on:
  workflow_run:
    workflows: [Native release, Release cache]
    types: [completed]
    branches: [main]

permissions:
  actions: write

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Rerun a run whose jobs were only cancelled
        id: triage
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # Unknown job state must alert, so only an explicit zero skips it.
          failed=$(gh api --paginate \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length' \
            | awk '{ total += $1 } END { print total + 0 }') || failed=unknown
          # The rerun is watched here because a rerun started with this
          # token may not raise another workflow_run event for this workflow.
          if [ "$failed" = "0" ] && [ "$RUN_ATTEMPT" = "1" ] \
            && gh api --method POST "repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs" \
            && sleep 15 \
            && gh run watch "$RUN_ID" --repo "$REPOSITORY" --exit-status --interval 30 > /dev/null; then
            echo "alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "alert=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post CI result to Discord
        if: steps.triage.outputs.alert == 'true'
        env:
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TIMESTAMP: ${{ github.event.workflow_run.updated_at }}
        run: |
          payload="$RUNNER_TEMP/discord-ci-alert.json"
          jq -n \
            --arg actor "$ACTOR" \
            --arg conclusion "$CONCLUSION" \
            --arg repository "$REPOSITORY" \
            --arg run_title "$RUN_TITLE" \
            --arg run_url "$RUN_URL" \
            --arg sha "$HEAD_SHA" \
            --arg timestamp "$TIMESTAMP" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: ("CI " + $conclusion + " on main"),
                url: $run_url,
                description: $run_title,
                color: 15158332,
                fields: [
                  {
                    name: "Commit",
                    value: ("[" + $sha[0:7] + "](https://github.com/" + $repository + "/commit/" + $sha + ")"),
                    inline: true
                  },
                  {
                    name: "Triggered by",
                    value: ("@" + $actor),
                    inline: true
                  }
                ],
                timestamp: $timestamp
              }]
            }' > "$payload"

          curl --fail-with-body --silent --show-error \
            --user-agent "OpenAI File Downloader, XaiImageApiFetch/1.0" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload" \
            "$DISCORD_WEBHOOK"
