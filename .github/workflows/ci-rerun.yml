# Rerun a main-branch Native release or Release cache run whose first attempt
# failed only through cancelled jobs (a runner that never arrived). Nothing is
# posted anywhere: CI failures are read in GitHub, not announced to Discord.
name: ci-rerun

on:
  workflow_run:
    workflows: [Native release, Release cache]
    types: [completed]
    branches: [main]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun a run whose jobs were only cancelled
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # Only an explicit zero means nothing really failed.
          failed=$(gh api --paginate \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length' \
            | awk '{ total += $1 } END { print total + 0 }')
          if [ "$failed" = "0" ] && [ "$RUN_ATTEMPT" = "1" ]; then
            gh api --method POST "repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
          fi
