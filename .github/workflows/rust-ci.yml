name: Rust CI

on:
  workflow_call:
    inputs:
      build_release:
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches: [rusty]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Lint metadata, unit-test executables, end-to-end binaries and optimized builds
# have distinct caches.
# All work can start together; release publication must depend on their success.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history dates each file for restore-mtimes.py.
          fetch-depth: 0
      - name: Date files by their last commit so cached workspace crates stay fresh
        run: python3 scripts/restore-mtimes.py
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          # Commit-unique exact key; see docs/ci.md "Caching" item 6.
          WT_CACHE_COMMIT: ${{ github.sha }}
        with:
          env-vars: WT_CACHE_COMMIT
          shared-key: lint
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo xtask deps-check
      - name: Verify native release packaging
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/wt-python-cache
        run: |
          python3 scripts/test-package-native.py
          python3 scripts/test-native-check.py
          python3 scripts/test-restore-mtimes.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  # test and native share one debug cache per OS: both build the workspace
  # with the dev profile, so their dependency artifacts are identical. Only
  # main saves caches; GitHub scopes a cache to the ref that saved it, so a
  # branch or tag save could never be restored anywhere else.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # The same build identity as the native job and releases, so tests see
      # the identity a shipped binary carries.
      WT_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history dates each file for restore-mtimes.py.
          fetch-depth: 0
      - name: Date files by their last commit so cached workspace crates stay fresh
        run: python3 scripts/restore-mtimes.py
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          # Commit-unique exact key; see docs/ci.md "Caching" item 6.
          WT_CACHE_COMMIT: ${{ github.sha }}
        with:
          env-vars: WT_CACHE_COMMIT
          shared-key: debug-${{ matrix.os }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.145
      - name: Install terminal integration dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux openssh-server lsof
      - name: Install terminal integration dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if ! brew list --versions tmux >/dev/null 2>&1; then
            brew install tmux
          fi
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --locked --doc

  # The end-to-end checks drive the built binary; they run beside the unit
  # tests instead of after them.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # The release check requires a full commit SHA as the build identity.
      WT_BUILD_ID: ${{ github.sha }}
      # Each check owns its temp home, sockets and tmux server, so they share
      # the runner; one per core (macOS runners have 3, Linux 4).
      WT_NATIVE_JOBS: ${{ matrix.os == 'macos-latest' && '3' || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history dates each file for restore-mtimes.py.
          fetch-depth: 0
      - name: Date files by their last commit so cached workspace crates stay fresh
        run: python3 scripts/restore-mtimes.py
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          # Commit-unique exact key; see docs/ci.md "Caching" item 6.
          WT_CACHE_COMMIT: ${{ github.sha }}
        with:
          env-vars: WT_CACHE_COMMIT
          shared-key: debug-${{ matrix.os }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install terminal integration dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux openssh-server lsof dbus-user-session
      - name: Install terminal integration dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if ! brew list --versions tmux >/dev/null 2>&1; then
            brew install tmux
          fi
      - run: cargo build --workspace --bins --examples --locked
      - name: Start the Linux resource-control test manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
      - name: Verify the complete native end-to-end suite
        run: python3 scripts/native-check.py --binary target/debug/wt --output "${{ runner.temp }}"
      - name: Install pinned Pi integration runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/wt-pi-runtime" --no-audit --no-fund --ignore-scripts @earendil-works/pi-coding-agent@1.2.0
          echo "$RUNNER_TEMP/wt-pi-runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify native Pi sessions against a loopback provider
        run: python3 scripts/native-pi-check.py --binary target/debug/wt --output "${{ runner.temp }}/wt-native-pi"
      - name: Retain native diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/wt-native-*
          if-no-files-found: ignore
          retention-days: 7

  build:
    if: toJSON(inputs.build_release) != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history dates each file for restore-mtimes.py.
          fetch-depth: 0
      - name: Date files by their last commit so cached workspace crates stay fresh
        run: python3 scripts/restore-mtimes.py
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          # Commit-unique exact key; see docs/ci.md "Caching" item 6.
          WT_CACHE_COMMIT: ${{ github.sha }}
        with:
          env-vars: WT_CACHE_COMMIT
          shared-key: release-${{ matrix.os }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --release --locked
