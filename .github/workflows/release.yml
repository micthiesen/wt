name: Native release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*', 'rust-test-*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional immutable tag (test branches require rust-test-)
        type: string
      publish:
        description: Publish a GitHub release after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      release: ${{ steps.plan.outputs.release }}
      epoch: ${{ steps.plan.outputs.epoch }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/release-plan.py

  checks:
    uses: ./.github/workflows/rust-ci.yml
    with:
      build_release: false

  package:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WT_BUILD_ID: ${{ needs.identity.outputs.sha }}
      RELEASE_VERSION: ${{ needs.identity.outputs.release }}
      RELEASE_TARGET: ${{ matrix.target }}
      SOURCE_DATE_EPOCH: ${{ needs.identity.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p wt-app -p wt-launcher --release --locked
      - name: Verify binary identity and package immutable assets
        run: python3 scripts/package-native.py package --release "$RELEASE_VERSION" --build-id "$WT_BUILD_ID" --target "$RELEASE_TARGET" --bin-dir target/release --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [identity, checks, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.release }}
      WT_BUILD_ID: ${{ needs.identity.outputs.sha }}
      RELEASE_PRERELEASE: ${{ needs.identity.outputs.prerelease }}
      RELEASE_PUBLISH: ${{ needs.identity.outputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Reject incomplete or mixed-platform releases
        run: python3 scripts/package-native.py manifest --release "$RELEASE_VERSION" --build-id "$WT_BUILD_ID" --output dist --installer scripts/install.sh
      - name: Publish immutable release
        if: needs.identity.outputs.publish == 'true'
        run: python3 scripts/publish-native.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: |
            dist/wt-release.json
            dist/SHA256SUMS
            dist/install.sh
          retention-days: 7
