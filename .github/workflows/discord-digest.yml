# AI-written digest of recent commits, posted to the Discord #updates channel.
#
# Debounce: every green native release on main starts a run whose first step
# sleeps 30 minutes; the concurrency group cancels a sleeping run when a newer
# push goes green, so the countdown resets and one digest covers the whole
# burst. "Since when" state is the head SHA of this workflow's own last
# successful run — no tags, no files (see .github/scripts/discord-digest.py).
#
# Gated on release success (workflow_run) rather than raw pushes so the
# digest only ever describes a green tree; commits pushed while red roll into
# the next green digest. Secrets: OPENAI_API_KEY, DISCORD_UPDATES_WEBHOOK.
name: discord-digest

on:
  workflow_run:
    workflows: [Native release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  digest:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Concurrency at JOB level, deliberately: a workflow-level group is
    # claimed by every run, including ones whose only job the `if:`
    # above skips — so a RED push's skipped run was cancelling the
    # debouncing digest of the previous green push, and the post
    # silently slipped to the next green burst (observed 2026-08-10).
    # A job-level group is only entered when the job actually starts,
    # i.e. only green runs cancel/reset the countdown.
    concurrency:
      group: discord-digest
      cancel-in-progress: true
    steps:
      - name: Debounce (a newer green push cancels this and restarts the countdown)
        run: sleep 1800
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Summarize commits and post to Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
        run: python3 .github/scripts/discord-digest.py
