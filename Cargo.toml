[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/micthiesen/wt"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
globset = "0.4"
libc = "0.2"
notify = "8.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
tempfile = "3"
tar = "0.4.46"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal", "net", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v5"] }
wt-config = { path = "crates/wt-config" }
wt-core = { path = "crates/wt-core" }
wt-platform = { path = "crates/wt-platform" }
wt-runtime = { path = "crates/wt-runtime" }
wt-store = { path = "crates/wt-store" }
wt-vcs = { path = "crates/wt-vcs" }
wt-tmux = { path = "crates/wt-tmux" }
wt-tui = { path = "crates/wt-tui" }
wt-harness = { path = "crates/wt-harness" }
wt-github = { path = "crates/wt-github" }
wt-lifecycle = { path = "crates/wt-lifecycle" }
wt-update = { path = "crates/wt-update" }
wt-launcher = { path = "crates/wt-launcher" }
wt-skills = { path = "crates/wt-skills" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
